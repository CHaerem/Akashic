name: TestFlight

# =============================================================================
# CD for the iOS app (SHIP-26): archive Release-CloudKit and upload to TestFlight.
#
# DELIBERATELY `workflow_dispatch`-ONLY. Not on push — every merge to main would otherwise burn a
# build number, queue ~15 min of Apple processing, and ping every tester for changes that may be
# web-only. Not on a tag schedule either, and never on `schedule:` — GitHub disables scheduled
# workflows after 60 days of repository inactivity, the trap that already shaped mapkit-token.yml.
# The owner's release act shrinks to: Actions → TestFlight → Run workflow.
#
# What the owner must set up ONCE before the first run (SHIP-26's OWNER half):
#   * repo variable  ASC_KEY_ID      — the App Store Connect API key's Key ID
#   * repo variable  ASC_ISSUER_ID   — the team's Issuer ID (ASC → Users and Access → Integrations)
#   * repo secret    ASC_PRIVATE_KEY — the key's .p8 CONTENT (App Manager role)
# The two IDs are variables, not secrets, by the same argument as MAPKIT_KEY_ID: both travel in
# clear text inside every request JWT, so masking them costs debuggability and buys nothing. Only
# the .p8 is secret. Signing itself is cloud-managed (`-allowProvisioningUpdates` + the API key),
# exactly as apple/Scripts/testflight-upload.sh does locally — no certificate export, no keychain.
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the green-gate step read the commit's check runs via GITHUB_TOKEN.
  checks: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    # The deploy-pages lesson, applied at the workflow level instead of discovered at the last
    # step: dispatching from a branch must not upload a build of unreviewed code.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The build number is derived from the commit count, which needs real history.
          fetch-depth: 0

      - name: Assert the credentials are configured
        # First, so a missing secret fails in two seconds with the fix named, not after a
        # twelve-minute archive. An empty-but-set secret would otherwise sail through and die
        # inside xcodebuild with an authentication error that names nothing.
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$ASC_KEY_ID" ]      || { echo "::error::repo VARIABLE ASC_KEY_ID is not set"; missing=1; }
          [ -n "$ASC_ISSUER_ID" ]   || { echo "::error::repo VARIABLE ASC_ISSUER_ID is not set"; missing=1; }
          [ -n "$ASC_PRIVATE_KEY" ] || { echo "::error::repo SECRET ASC_PRIVATE_KEY is not set (the .p8 content)"; missing=1; }
          [ "$missing" = 0 ] || exit 1
          echo "ok: all three credentials present"

      - name: Assert apple-ci is green for the native code being shipped
        # No upload from a red tree. The FIRST version of this step demanded a check-run on the
        # exact dispatched SHA and was wrong on day one: apple-ci is PATH-FILTERED to `apple/**`,
        # so a docs- or web-only push leaves main's tip with no check-run at all, and the gate
        # refused with "absent" on a tree whose native code was fully tested. The honest question
        # is two halves: is the LATEST completed apple-ci on main green, and has anything under
        # `apple/**` (or apple-ci.yml itself) changed since the commit that run tested. If yes to
        # both, the native code in this dispatch is exactly the code that went green.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r tested conclusion < <(gh api \
            "repos/${{ github.repository }}/actions/workflows/apple-ci.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0] | .head_sha + " " + .conclusion')
          if [ -z "${tested:-}" ]; then
            echo "::error::no completed apple-ci run exists on main at all — run one before shipping."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::the latest apple-ci on main ($tested) concluded '$conclusion' — fix main before shipping it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tested" HEAD; then
            echo "::error::the last green apple-ci tested $tested, which is not an ancestor of this dispatch — history moved; re-run apple-ci."
            exit 1
          fi
          changed=$(git log --oneline "$tested"..HEAD -- apple/ .github/workflows/apple-ci.yml)
          if [ -n "$changed" ]; then
            echo "::error::apple/ changed after the last green apple-ci ($tested) with no newer run:"
            echo "$changed"
            echo "Push should have triggered one — wait for it, or the paths filter no longer covers what changed."
            exit 1
          fi
          echo "ok: latest apple-ci green at $tested, and apple/ untouched since"

      - name: Select an Xcode that carries FoundationModels
        # THE ONE SHARP EDGE, and the reason this workflow could not be a copy of apple-ci's
        # setup. The archive arms AKASHIC_REQUIRE_INTELLIGENCE, which turns a missing
        # FoundationModels SDK into a BUILD ERROR — because the alternative, measured and
        # documented as QUA-05, is a green build that silently compiled the whole paid AI family
        # out of the shipping binary (`canImport` gates ~700 lines). The runner's DEFAULT Xcode is
        # 16.4, which cannot compile it; the image also carries newer Xcodes (its simulators run
        # iOS 26.x, which only ship with Xcode 26). Pick the newest and let the tripwire judge it:
        # if the pick is ever wrong, the archive fails loudly instead of shipping a gutted app.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app | sort -V
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          echo "selected: $newest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialise the API key
        # xcodebuild wants a FILE path; ~/.appstoreconnect/private_keys is where altool looks
        # without being told. Written with restrictive permissions and removed in the always()
        # cleanup step below — the runner is ephemeral, but "the VM gets destroyed anyway" is not
        # a reason to leave key material lying around for later steps to read.
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8
          # A pasted key with Windows line endings or a missing trailing newline fails deep inside
          # signing with an unrelated-looking error; say it here instead.
          head -1 ~/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::ASC_PRIVATE_KEY does not look like a .p8 (no BEGIN PRIVATE KEY header)"; exit 1; }

      - name: Archive, export and upload
        # Mirrors apple/Scripts/testflight-upload.sh step for step — same configuration, same
        # ExportOptions.plist, same cloud signing, same armed tripwire — so a local upload and a
        # CI upload are the same artefact. The one CI-only addition is the BUILD NUMBER:
        # project.yml pins CURRENT_PROJECT_VERSION to a hand-bumped integer (9 at the time this
        # landed), and App Store Connect refuses a reused number. `100 + run_number` is monotonic
        # per workflow run, immune to re-dispatching the same commit, and permanently above the
        # hand-bumped series — the two can never collide.
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd apple
          xcodegen generate
          BUILD_NUMBER=$((100 + ${{ github.run_number }}))
          echo "build number: $BUILD_NUMBER (run ${{ github.run_number }})"
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcodebuild -project Akashic.xcodeproj \
            -scheme Akashic \
            -configuration Release-CloudKit \
            -destination 'generic/platform=iOS' \
            -archivePath build/Akashic.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="9LVCB72DT8" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) AKASHIC_REQUIRE_INTELLIGENCE' \
            archive

          xcodebuild -exportArchive \
            -archivePath build/Akashic.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Scripts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "uploaded — Apple processing takes ~5–15 min before the build appears in TestFlight"

      - name: Assert the archived plist carries the keys the app depends on
        # The INFOPLIST_KEY trap, asserted on the artefact that actually ships. apple-ci asserts a
        # simulator build's plist; this is the archive TestFlight receives, and it is the one that
        # once shipped without CKSharingSupported while every spec looked correct.
        run: |
          set -euo pipefail
          PLIST="apple/build/Akashic.xcarchive/Products/Applications/Akashic.app/Info.plist"
          for key in CKSharingSupported UIBackgroundModes; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" > /dev/null 2>&1 \
              || { echo "::error::$key is absent from the ARCHIVED Info.plist — the CKShare/push regression"; exit 1; }
          done
          echo "ok: archived plist carries CKSharingSupported and UIBackgroundModes"

      - name: Remove the key material
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
