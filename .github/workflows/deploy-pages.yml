name: Deploy to GitHub Pages

# =============================================================================
# GitHub Pages deploy - Phase 4 / D7 of APPLE-MIGRATION-PLAN.md.
#
# LIVE. Every push to `main` deploys akashic.no from here.
#
# CUTOVER DONE (LEG-09, 2026-07-27). This is the live deploy path for akashic.no.
# `deploy.yml` (Cloudflare) was deleted in the same commit. The owner waived
# hosting rollback, so there is deliberately no second host kept warm.
# =============================================================================

on:
  # Cutover done (LEG-09): this is the live deploy path for akashic.no. `deploy.yml`
  # (Cloudflare) was deleted in the same commit, so the two hosts never build the
  # same commit in parallel — which is exactly what the header used to warn about.
  push:
    branches: [main]
  # Kept so a deploy can still be forced without an empty commit.
  #
  # ONLY `main` CAN ACTUALLY DEPLOY. The `github-pages` environment carries a deployment branch
  # policy allowing `main` alone, so dispatching this from a branch BUILDS SUCCESSFULLY and then
  # fails at the deploy job — every build-side assertion green, one red step at the end. That is a
  # repository permissions setting, not a broken workflow, and the reason this comment is here is
  # that the failure looks exactly like something to "fix" in this file. It is not; either dispatch
  # from `main` or change the environment policy in Settings → Environments.
  workflow_dispatch:

# GITHUB_TOKEN scopes the GitHub Pages deployment needs.
# `pages: write` + `id-token: write` are required by actions/deploy-pages@v4;
# `contents: read` lets actions/checkout read the (public) repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, and never cancel an in-flight
# one - cancelling mid-deploy can leave the live site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Assert E2E fixture mode is off
        # QUA-40. Since the E2E fixture landed, VITE_E2E_TEST_MODE no longer merely skips the
        # Apple ID pill — it swaps the whole data layer for a fixture CloudKit container. A
        # production build made with it set would serve fabricated journeys and never contact
        # CloudKit, and it would render perfectly, so a smoke check would not notice.
        #
        # MEASURED leak path, and it is not the one you would guess: a GitHub *repository
        # variable* named VITE_E2E_TEST_MODE would NOT reach this build, because repo vars only
        # exist via an explicit `${{ vars.X }}` reference and nothing here references it. What
        # does reach the build is the ambient environment — `scripts/build.js` runs
        # `execSync('vite build', { env: process.env })` — and Vite's own auto-loading of
        # `.env` / `.env.local`. Hence a check on the environment, before the build.
        run: |
          if [ -n "${VITE_E2E_TEST_MODE:-}" ]; then
            echo "::error::VITE_E2E_TEST_MODE is set for a production build. Refusing to deploy."
            exit 1
          fi

      - name: Mint the MapKit JS token
        # MAP-05 SHIP-BLOCKER, and it had to land in the same change as the deletion.
        #
        # Until MAP-05 this workflow passed VITE_MAPBOX_TOKEN and set no map vendor, so the live
        # journey view was Mapbox. Deleting the package moves production onto MapKit — and NO
        # workflow was minting a MapKit token into a build. `mapkit-token.yml` proves the credential
        # is healthy and deliberately gates nothing; it does not produce a token for the bundle.
        # Without this step the deploy would have gone green and akashic.no would have rendered
        # `MapErrorFallback` with "No MapKit token configured" on every journey
        # (src/lib/map/mapkit/useMapKitJourney.ts:111) while the landing globe looked perfect,
        # because MAP-02's globe needs no token. A smoke check on the front page would not have
        # caught it.
        #
        # Minted per deploy rather than stored, which is the whole argument in
        # scripts/mapkit/mintToken.mjs's header: the .p8 does not expire, so every push resets the
        # fuse. A pasted token would instead lapse on a date nobody remembers, and there is no
        # backend here to rotate it.
        #
        # BOTH origins, and they are disjoint — measured in that same header: the claim `akashic.no`
        # alone 401s a request from `https://www.akashic.no`, and `*.akashic.no` alone 401s the
        # apex. Using either one on its own breaks half the site.
        #
        # Key ID and Team ID are repo VARIABLES, not secrets: both travel in clear text inside every
        # token (as `kid` and `iss`) and ship in the public bundle, so masking them would cost
        # debuggability and buy nothing. Only the .p8 is secret. The minted token is public by
        # design and is protected by its origin claim, not by secrecy — hence GITHUB_ENV rather than
        # an attempt to mask it.
        env:
          MAPKIT_KEY_ID: ${{ vars.MAPKIT_KEY_ID }}
          MAPKIT_TEAM_ID: ${{ vars.MAPKIT_TEAM_ID }}
          MAPKIT_PRIVATE_KEY: ${{ secrets.MAPKIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TOKEN="$(node scripts/mapkit/mintToken.mjs --origin 'akashic.no,*.akashic.no')"
          # Fail here rather than shipping a tokenless bundle. mintToken.mjs exits non-zero on a
          # missing credential, but an empty-but-successful result would otherwise sail through
          # `set -e` and produce exactly the silent breakage this step exists to prevent.
          if [ -z "$TOKEN" ]; then
            echo "::error::minted MapKit token is empty — refusing to build a journey view that cannot render."
            exit 1
          fi
          echo "VITE_MAPKIT_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build
        env:
          # MAP-05: VITE_MAPBOX_TOKEN is gone from here with the package. The GitHub secret itself
          # still exists and revoking the Mapbox account key is the owner's task, not this file's.
          # VITE_MAPKIT_TOKEN arrives from the minting step above via GITHUB_ENV.
          #
          # A CloudKit JS API token is public and container-scoped — it is baked
          # into the client bundle either way — so it comes from repo `vars`,
          # not `secrets`.
          VITE_CLOUDKIT_ENV: ${{ vars.VITE_CLOUDKIT_ENV || 'development' }}
          VITE_CLOUDKIT_API_TOKEN: ${{ vars.VITE_CLOUDKIT_API_TOKEN || '' }}
        run: npm run build

      - name: Assert the built bundle carries a MapKit token and no Mapbox origin
        # MAP-05's `done_when` is "no mapbox origin in the built bundle", and the lesson this repo
        # keeps relearning is to assert against the BUILT ARTIFACT rather than the spec that
        # produced it (INFOPLIST_KEY_* was declared correctly and silently dropped from every
        # shipped plist). Both halves are checked here because both are silent failures: a bundle
        # with no token renders MapErrorFallback, and a bundle still reaching api.mapbox.com would
        # mean the deletion was incomplete in a way no test covers.
        #
        # THE SECOND CHECK IS SHARPER THAN IT LOOKS, and this is measured rather than hoped for.
        # `mapKitToken()` reads `import.meta.env.VITE_MAPKIT_TOKEN`, which Vite substitutes
        # statically — so in a build with no token it becomes `void 0`, and Rollup then
        # dead-code-eliminates the whole loader with it. MEASURED on this tree: a tokenless build
        # contains the string "mapkit" exactly once (inside the MapErrorFallback message) and
        # `cdn.apple-mapkit.com` NOT AT ALL, while a build with a minted token does contain it.
        # So this grep is a true test of "the minting step above actually reached the bundle" —
        # verified failing without the token and passing with it, which is the only way to know a
        # guard works.
        run: |
          set -euo pipefail
          if grep -rlq "api\.mapbox\.com" dist/; then
            echo "::error::the built bundle still references api.mapbox.com — MAP-05 is incomplete."
            grep -rl "api\.mapbox\.com" dist/
            exit 1
          fi
          if ! grep -rlq "cdn\.apple-mapkit\.com" dist/; then
            echo "::error::the built bundle names no MapKit CDN — the journey view cannot load."
            exit 1
          fi
          echo "ok: no Mapbox origin, MapKit loader present"

      - name: Assert the E2E fixture is absent from the bundle
        # Belt to the previous step's braces, and the one that survives a leak path nobody
        # anticipated: it greps the BUILT ARTIFACT for three independent fixture signals
        # rather than trusting that Rollup dropped the dead dynamic import. Same lesson as
        # asserting against the built Info.plist instead of the XcodeGen spec.
        #
        # Verified in both directions: it passes on a flag-off build and FAILS on a
        # `VITE_E2E_TEST_MODE=true vite build` (which emits assets/e2eCloudKitContainer-*.js).
        # The first version of the guard had one signal, a decorative reference Rollup inlined
        # away, and reported "ok" on a build that plainly contained the fixture.
        run: node scripts/assertNoFixtureInBundle.mjs dist

      - name: Create static fallback (404.html)
        # Copy index.html -> 404.html so GitHub Pages serves the app shell for
        # any unknown path. NOTE: the app has NO client-side router - navigation
        # is query-param deep links against a single index.html - so this is
        # only a PWA/static safety net for stray or mistyped paths and hard
        # refreshes, NOT SPA route rewriting. Done in CI only (never committed).
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # public/CNAME is copied into dist/ by Vite and rides along in the artifact.
          # MEASURED 2026-07-27: that does NOT set the Pages custom domain. After a
          # successful run of this workflow, `gh api repos/.../pages` still reported
          # `cname: null`, and Pages answered "Site not found" for Host: akashic.no.
          # With `build_type: workflow` the CNAME file is not honoured — the domain has
          # to be set in Settings → Pages (or `gh api -X PUT .../pages -f cname=...`).
          # It is set now. Expect ~45 s of edge propagation after setting it before
          # akashic.no starts resolving to the site; a 404 in the first seconds is not
          # a failed deploy.
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Assert the served site carries the dot-paths, not just the artifact
        # MEASURED 2026-07-28, and it was a live production defect for a day:
        # https://akashic.no/.well-known/apple-app-site-association returned 404 and served the
        # SPA shell, so iOS could not associate the domain and EVERY Universal Link was dead —
        # while `public/.well-known/apple-app-site-association` was committed, Vite copied it into
        # `dist/`, and every build-side check was green. Discriminating measurement: from the same
        # build, `/CNAME` and `/offline.html` answered 200 while `/.DS_Store` and
        # `/.well-known/...` both answered 404. Pages was filtering paths beginning with a dot;
        # `.nojekyll` (now in `public/`, so Vite carries it through) is the documented fix.
        #
        # This step exists because NO BUILD-SIDE CHECK CAN SEE THIS. The file is present in the
        # artifact and absent from the site, which is the same shape as the INFOPLIST_KEY trap and
        # the tokenless-bundle trap: the thing that is missing is invisible unless something
        # asserts on the SERVED artefact. SHIP-07 shipped green with a verify list that grepped the
        # entitlements file and never fetched the URL iOS actually reads.
        #
        # Deliberately asserts the CONTENT, not only the status: a 200 serving the SPA shell is
        # exactly what the broken state looked like, so `applinks` is the only honest signal.
        run: |
          set -euo pipefail
          url="https://akashic.no/.well-known/apple-app-site-association"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/aasa -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = 200 ] && grep -q applinks /tmp/aasa; then
              echo "ok: AASA served with applinks (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, applinks $(grep -c applinks /tmp/aasa || true) — waiting for edge propagation"
            sleep 20
          done
          echo "::error::$url did not serve an applinks document. Universal Links are dead until it does."
          echo "Most likely cause: dist/.nojekyll is missing, so Pages filters every path beginning with a dot."
          head -c 400 /tmp/aasa || true
          exit 1
