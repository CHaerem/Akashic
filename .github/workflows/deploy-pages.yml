name: Deploy to GitHub Pages

# =============================================================================
# GitHub Pages deploy - Phase 4 / D7 of APPLE-MIGRATION-PLAN.md.
#
# LIVE. Every push to `main` deploys akashic.no from here.
#
# CUTOVER DONE (LEG-09, 2026-07-27). This is the live deploy path for akashic.no.
# `deploy.yml` (Cloudflare) was deleted in the same commit. The owner waived
# hosting rollback, so there is deliberately no second host kept warm.
# =============================================================================

on:
  # Cutover done (LEG-09): this is the live deploy path for akashic.no. `deploy.yml`
  # (Cloudflare) was deleted in the same commit, so the two hosts never build the
  # same commit in parallel — which is exactly what the header used to warn about.
  push:
    branches: [main]
  # Kept so a deploy can still be forced without an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN scopes the GitHub Pages deployment needs.
# `pages: write` + `id-token: write` are required by actions/deploy-pages@v4;
# `contents: read` lets actions/checkout read the (public) repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, and never cancel an in-flight
# one - cancelling mid-deploy can leave the live site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # A CloudKit JS API token is public and container-scoped — it is baked
          # into the client bundle either way — so it comes from repo `vars`,
          # not `secrets`.
          VITE_CLOUDKIT_ENV: ${{ vars.VITE_CLOUDKIT_ENV || 'development' }}
          VITE_CLOUDKIT_API_TOKEN: ${{ vars.VITE_CLOUDKIT_API_TOKEN || '' }}
        run: npm run build

      - name: Create static fallback (404.html)
        # Copy index.html -> 404.html so GitHub Pages serves the app shell for
        # any unknown path. NOTE: the app has NO client-side router - navigation
        # is query-param deep links against a single index.html - so this is
        # only a PWA/static safety net for stray or mistyped paths and hard
        # refreshes, NOT SPA route rewriting. Done in CI only (never committed).
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # public/CNAME is copied into dist/ by Vite and rides along in the artifact.
          # MEASURED 2026-07-27: that does NOT set the Pages custom domain. After a
          # successful run of this workflow, `gh api repos/.../pages` still reported
          # `cname: null`, and Pages answered "Site not found" for Host: akashic.no.
          # With `build_type: workflow` the CNAME file is not honoured — the domain has
          # to be set in Settings → Pages (or `gh api -X PUT .../pages -f cname=...`).
          # It is set now. Expect ~45 s of edge propagation after setting it before
          # akashic.no starts resolving to the site; a 404 in the first seconds is not
          # a failed deploy.
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
