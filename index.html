    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a0a0f" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Akashic" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Additional Meta -->
    <meta name="description" content="Relive every journey on a rotating 3D globe. Weather, photos, elevation and the story of each day — and your memories never leave your family iCloud." />
    <meta name="format-detection" content="telephone=no" />

    <!--
      Share-card metadata (DIFF-03). Sharing is the product's only acquisition channel — a
      published journey's URL, built by AppInfo.showcaseURL as https://akashic.no/?journey=<slug>
      — and until now this file carried not one og: or twitter: tag, so every one of those links
      rendered in iMessage, WhatsApp and Slack as a naked blue URL.

      Copy is the App Store subtitle and promotional text verbatim (docs/store/app-store-listing.md
      §2) so the card, the listing and public/og-image.jpg cannot drift apart. og:image is
      generated by `npm run generate-og-image`; absolute URLs because every scraper requires them.

      ── WHAT THIS CANNOT DO, AND WHAT PER-JOURNEY PREVIEWS WOULD TAKE ──────────────────────────
      These tags are SITE-WIDE. A link to ?journey=inca-trail gets the same card as the site root:
      Akashic's own name, subtitle and hero image — never that journey's name or its own photo.

      That is not an oversight to fix later in this file. Scrapers do not run JavaScript, so no
      amount of client-side work can change it; and the showcase is a static single-page app on
      GitHub Pages, which serves one index.html for every path and offers no request-time hook.
      The journey is also addressed by *query string*, which GitHub Pages cannot route on at all.
      Three ways out, in ascending order of what they cost:

        1. Build-time prerender. Emit /j/<slug>/index.html per published journey at deploy time,
           each with its own og:title/og:image, and have it redirect into the SPA. Cheapest, but
           it makes the deploy depend on the list of published journeys, and a journey published
           from the app is invisible to shares until the next deploy — a delay users would read
           as the share being broken.
        2. An edge worker in front of the site, rewriting the tags per request from the public
           CloudKit mirror. Correct and instant, but it ends "there is no backend of ours", adds a
           request-time dependency on CloudKit, and every scraper hit becomes billable public-DB
           traffic — which is billed to us, not the customer (see CLAUDE.md).
        3. Leave it site-wide. The card still says "Akashic" with a real image, which is most of
           the value: the link stops looking broken and starts looking like a product.

      (3) is what ships now. (1) vs (2) is a real product decision about whether per-journey
      previews are worth a serving layer, and it wants the external-beta data before anyone picks.
      ──────────────────────────────────────────────────────────────────────────────────────────
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Akashic" />
    <meta property="og:url" content="https://akashic.no/" />
    <meta property="og:title" content="Akashic — Your treks on a living globe" />
    <meta property="og:description" content="Relive every journey on a rotating 3D globe. Weather, photos, elevation and the story of each day — and your memories never leave your family iCloud." />
    <meta property="og:image" content="https://akashic.no/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Scrapers use this as the image's alt text; WhatsApp and Slack both surface it. -->
    <meta property="og:image:alt" content="A snow-covered mountain range above a sea of cloud at sunrise, with the Akashic globe mark" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter/X reads og: for most fields but needs its own card type to render the large image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Akashic — Your treks on a living globe" />
    <meta name="twitter:description" content="Relive every journey on a rotating 3D globe. Weather, photos, elevation and the story of each day — and your memories never leave your family iCloud." />
    <meta name="twitter:image" content="https://akashic.no/og-image.jpg" />
    <meta name="twitter:image:alt" content="A snow-covered mountain range above a sea of cloud at sunrise, with the Akashic globe mark" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <!-- LEG-17: self-hosted. Was three lines reaching fonts.googleapis.com / fonts.gstatic.com, which
         sent every visitor's IP to Google before any of the family's content rendered. Preloaded so the
         first paint does not wait on a stylesheet round-trip, which the <link> version did anyway. -->
    <link rel="preload" href="/fonts/roboto-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/roboto.css">

    <!-- Scrapers that find no og:title fall back to this; keep it in step with the og: tags. -->
    <title>Akashic — Your treks on a living globe</title>
  </head>
  <body style="margin: 0; background: #0a0a0f;">
    <div id="root" style="min-height: 100vh; background: #0a0a0f;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
