name: Akashic
options:
  bundleIdPrefix: no.akashic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

# QUA-06. Without `knownRegions` the generated project lists only `en` + `Base`, so Xcode
# compiles `Localizable.xcstrings` for English only: `nb.lproj/Localizable.strings` is never
# produced and the app falls back to English on a Norwegian device even though the catalogue
# holds every translation. XcodeGen infers regions from `.lproj` directories in the source tree,
# and a String Catalog has none — it is a single file — so the list has to be declared.
#
# `CFBundleLocalizations` in the built plist is what iOS reads to decide which languages the app
# claims, and the App Store listing's language list is derived from it. Assert against the BUILT
# plist, never this file:
#   plutil -p "$(...)/Akashic.app/Info.plist" | grep -A4 CFBundleLocalizations
#   ls "$(...)/Akashic.app" | grep lproj        # expect en.lproj and nb.lproj
knownRegions:
  - en
  - nb
  - Base

# Build configurations.
#   Debug / Release  -> no code signing, no team required (default simulator builds + CI).
#   Debug-CloudKit   -> debug build WITH the CloudKit + Push entitlements, for running the
#                       CKSyncEngine sync layer on a Simulator signed into iCloud (simulator
#                       builds honor entitlements without provisioning). Launch it with
#                       AKASHIC_CLOUDKIT=1 (see README "Activating CloudKit sync").
#   Release-CloudKit -> release build with the same entitlements (device/TestFlight).
#                       Both *-CloudKit configs need a DEVELOPMENT_TEAM (set below or via CLI).
configs:
  Debug: debug
  Release: release
  Debug-CloudKit: debug
  Release-CloudKit: release
  Debug-Production: debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Simulator builds must succeed without a signing team on this machine.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Akashic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # C7: register Akashic as a GPX document handler (sharing a `.gpx` from Files/Mail/Strava
    # straight into the app — see AkashicApp.onOpenURL). `GENERATE_INFOPLIST_FILE: YES` below
    # means Xcode synthesizes Info.plist from `INFOPLIST_KEY_*` build settings, but there is no
    # `INFOPLIST_KEY_` equivalent for an array/dict key like `CFBundleDocumentTypes` or
    # `UTImportedTypeDeclarations` (those only cover scalar values) — XcodeGen's own
    # `info.properties` is the one path that still merges arbitrary plist content into a
    # GENERATE_INFOPLIST_FILE=YES target, so it carries these three keys instead.
    # `com.topografix.gpx` is not a system UTI (unlike e.g. `public.image`), so it must be
    # declared here as IMPORTED (we read/parse it; we don't own or export the type) rather than
    # merely referenced.
    info:
      path: Generated/Akashic-Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Track
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX Track
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
        # We copy and parse (GPXParser) rather than edit in place, so the system should never
        # offer in-place editing for a file we open.
        LSSupportsOpeningDocumentsInPlace: false
        # These two live here, NOT as INFOPLIST_KEY_* settings, and that distinction is
        # load-bearing: Xcode's INFOPLIST_KEY_ mechanism only merges keys on a fixed
        # allowlist, and neither of these is on it. Declared as INFOPLIST_KEY_* they were
        # silently discarded — absent from every build shipped through build 8 — which left
        # CKShare acceptance and push-driven sync dead in the binary while project.yml
        # claimed both were carried. Assert against the BUILT plist, never the spec:
        #   plutil -p "$(...)/Akashic.app/Info.plist" | grep CKSharingSupported
        # apple-ci.yml does exactly that now, so this cannot silently regress (QUA-01).
        #
        # Required for CloudKit share invitations to open in the app (T2.8). Without it iOS
        # hands the link to Safari instead of giving the metadata to the app delegate.
        CKSharingSupported: true
        # CloudKit delivers "the server changed" as a silent push, and CKSyncEngine logs
        # "BUG IN CLIENT OF CLOUDKIT: CloudKit push notifications require the
        # 'remote-notification' background mode" without this. Harmless in non-CloudKit
        # configs — nothing registers for pushes there. Note the key alone is not enough:
        # the app must also call registerForRemoteNotifications (SHIP-02).
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: Akashic
      # Privacy manifest (SHIP-04). Must land at the BUNDLE ROOT, not inside Resources/, which is
      # why it is listed explicitly with `buildPhase: resources` rather than picked up by the
      # `path: Akashic` sweep — Apple's tooling looks for PrivacyInfo.xcprivacy at the top level of
      # the .app. Verify after any project change with:
      #   find "$(...)/Akashic.app" -maxdepth 1 -name '*.xcprivacy'
      - path: Akashic/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # QUA-06: the string catalogues. Both are inside `path: Akashic` above and so are already
      # swept up, but they are listed explicitly for two reasons: the sweep classifies by
      # extension and a silently-misclassified `.xcstrings` produces an app that builds, runs, and
      # is simply never translated; and `AppShortcuts.xcstrings` MUST be named exactly that — App
      # Intents phrase localisation looks for that filename and nothing else, so a rename would
      # break Siri's Norwegian without breaking the build.
      #
      # Verify both reached the bundle (they compile to a single .loctable per language):
      #   find "$(...)/Akashic.app" -name '*.loctable'
      - path: Akashic/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Akashic/Resources/AppShortcuts.xcstrings
        buildPhase: resources
      # Fixture JSON recovered from git history — bundled so the app runs on
      # fixtures by default (before CloudKit is wired up). Owned by another agent;
      # referenced read-only here.
      - path: Fixtures/recovered/kilimanjaro.json
        buildPhase: resources
      - path: Fixtures/recovered/mountKenya.json
        buildPhase: resources
      - path: Fixtures/recovered/incaTrail.json
        buildPhase: resources
      # DIFF-10: photographs for the bundled fixtures + the once-ever demo journey, and the sidecar
      # manifest that maps them to journey slugs and days (FixtureMedia). Kept OUT of
      # Fixtures/recovered/ so that recovered archive stays byte-identical. ~474 KB of JPEG total.
      - path: Fixtures/demo-media/demo-photos.json
        buildPhase: resources
      - path: Fixtures/demo-media/demo-kilimanjaro-summit.jpg
        buildPhase: resources
      - path: Fixtures/demo-media/demo-mount-kenya.jpg
        buildPhase: resources
      - path: Fixtures/demo-media/demo-inca-trail.jpg
        buildPhase: resources
    dependencies:
      # WidgetKit extension — BUILT but deliberately NOT EMBEDDED for v1.0 (QUA-09).
      #
      # The widget cannot display real data, for two independent reasons that both have to be
      # fixed before it is worth shipping:
      #   1. It has no App Group entitlement in any configuration, so `AppGroup.containerURL`
      #      never resolves and it cannot read a snapshot. That is deliberate and documented on
      #      the AkashicWidgets target below — adding the entitlement needs the capability added
      #      in Xcode's GUI, because `xcodebuild -allowProvisioningUpdates` refuses to mint the
      #      extension's profile from an App Store Connect API key, and carrying an unusable
      #      entitlement blocked archiving outright.
      #   2. Nothing calls `WidgetSnapshot.publish` anywhere in the app. Its only caller is
      #      WidgetGalleryHarness, which exists for screenshots.
      #
      # So embedded, it would appear in every customer's widget gallery and render its bundled
      # Kilimanjaro placeholder — a stranger's trek, permanently, on the home screen of someone
      # who paid. `embed: false` keeps the target compiling as part of every app build, so the
      # code cannot rot and its 8 tests keep running, while nothing ships to a customer.
      #
      # To ship it: add the App Group capability in Xcode (see
      # AkashicWidgets/AkashicWidgets.entitlements, kept as the reference), restore
      # CODE_SIGN_ENTITLEMENTS on both widget configs, wire `WidgetSnapshot.publish` into the
      # store's reload path, then set this back to `embed: true`.
      - target: AkashicWidgets
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app
        PRODUCT_NAME: Akashic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Akashic
        # Export-compliance declaration, carried in every build so TestFlight never blocks on
        # "Missing Compliance". Akashic uses only exempt encryption — HTTPS and CloudKit, no
        # custom cryptography — which is the standard exemption. (Set once by hand on build 2
        # via the ASC API before this key existed; from build 3 on it ships in the binary.)
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # iPhone is portrait-only (D5). Landscape shipped unlocked and untested, and on a Max phone
        # it silently routes into the `.regular` width branch — the iPad floating-panel layout in
        # GlobeExperienceView, which was designed for a 13-inch canvas and never for a phone held
        # sideways. Locking it is the honest fix for v1.0; supporting it properly is its own task.
        # iPad keeps all four orientations (see the _iPad key below), which is where the panel
        # layout belongs.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # NOTE: CKSharingSupported and UIBackgroundModes are deliberately NOT here. Xcode
        # drops non-allowlisted INFOPLIST_KEY_* settings without warning; both now live in
        # the `info: properties:` block above, which is the only form that reaches the
        # built plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        # Opt-in CloudKit builds. Not used by the default `build`/`test` invocations,
        # so the machine needs no signing team for CI. To run/ship CloudKit sync:
        #   1. Set DEVELOPMENT_TEAM below (or pass DEVELOPMENT_TEAM=XXXX on the CLI).
        #   2. Build `Debug-CloudKit` (simulator dev) or `Release-CloudKit` (device).
        #   3. Sign the Simulator into iCloud, then launch with AKASHIC_CLOUDKIT=1.
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS gates every CKContainer/CKSyncEngine touchpoint
        # behind `#if AKASHIC_CLOUDKIT_BUILD`. CRITICAL: instantiating a CKContainer in a binary
        # WITHOUT the icloud-services entitlement TRAPS (SIGTRAP) — so the runtime accountStatus
        # gate cannot be the first line of defense; the entitlement itself is. Only these signed
        # configs define the flag, so the default Debug/Release builds compile the sync layer but
        # never construct a CKContainer.
        Debug-CloudKit:
          CODE_SIGN_ENTITLEMENTS: Akashic/Support/Akashic.entitlements
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AKASHIC_CLOUDKIT_BUILD"
        Release-CloudKit:
          # Separate file: aps-environment must be `production` for App Store /
          # TestFlight distribution profiles (see the file's own comment).
          CODE_SIGN_ENTITLEMENTS: Akashic/Support/Akashic-Release.entitlements
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8
          # Production, because TestFlight and App Store builds ALWAYS use the production
          # CloudKit environment regardless of entitlements (see APPLE-MIGRATION-RUNBOOK §4a).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AKASHIC_CLOUDKIT_BUILD AKASHIC_CLOUDKIT_PRODUCTION"
        # Development-signed, but pointed at the PRODUCTION CloudKit database — the
        # only way to run the migration import into Production (TestFlight builds
        # read Production but cannot themselves be aimed elsewhere). Every write
        # here is real. See Akashic-Production.entitlements.
        Debug-Production:
          CODE_SIGN_ENTITLEMENTS: Akashic/Support/Akashic-Production.entitlements
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8
          # AKASHIC_CLOUDKIT_PRODUCTION mirrors the entitlement above. No runtime API on iOS
          # reports which CloudKit environment the signature selected, so the UI can only tell
          # the truth if this flag is kept in step with CODE_SIGN_ENTITLEMENTS.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AKASHIC_CLOUDKIT_BUILD AKASHIC_CLOUDKIT_PRODUCTION"

  AkashicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AkashicTests
      # Bundle the fixtures into the test bundle too, so unit tests can decode
      # them without relying on the host app bundle layout.
      - path: Fixtures/recovered/kilimanjaro.json
        buildPhase: resources
      - path: Fixtures/recovered/mountKenya.json
        buildPhase: resources
      - path: Fixtures/recovered/incaTrail.json
        buildPhase: resources
      # DIFF-10 fixture photographs + manifest, so the photo pipeline is unit-testable from the
      # test bundle without the host app's layout.
      - path: Fixtures/demo-media/demo-photos.json
        buildPhase: resources
      - path: Fixtures/demo-media/demo-kilimanjaro-summit.jpg
        buildPhase: resources
      - path: Fixtures/demo-media/demo-mount-kenya.jpg
        buildPhase: resources
      - path: Fixtures/demo-media/demo-inca-trail.jpg
        buildPhase: resources
    dependencies:
      - target: Akashic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # QUA-10 / QUA-29 — the UI test target. The project had exactly one test target and it was a
  # `bundle.unit-test`, so nothing automated had ever driven the app's UI: `Views/` sat at 6.0%
  # coverage of 21,384 executable lines, and today's accessibility pass could verify none of what
  # it built by NAVIGATION (Accessibility Inspector is a macOS GUI app with no scriptable
  # interface). `XCUIApplication.performAccessibilityAudit()` is the programmatic form of exactly
  # that audit, and it needs a `bundle.ui-testing` target to live in — which is why the two tasks
  # were one pass.
  #
  # A UI test target runs OUT of process: it does not link the app, so it cannot see `Journey`,
  # `EntitlementPolicy` or any other app symbol. Everything it knows about the app it learns by
  # launching it (`AKASHIC_*` launch environment, see apple/README.md) and reading the
  # accessibility tree — which is why `AkashicUITests/Support/` has its own tiny copies of the
  # few constants it asserts against.
  AkashicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AkashicUITests
    dependencies:
      - target: Akashic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # XcodeGen infers this from the `Akashic` dependency above, but a UI test bundle with no
        # TEST_TARGET_NAME builds fine and then fails at RUN time with "no target application"
        # — a failure that reads like a broken simulator rather than a missing build setting. It
        # is cheap to state and expensive to rediscover.
        TEST_TARGET_NAME: Akashic

  # WidgetKit extension. Data reaches it via a WidgetSnapshot JSON in the App-Group container
  # (see AppGroup / WidgetDataStore); with no App Group configured (unsigned simulator build)
  # the widget renders its bundled placeholder. The shared snapshot/view/data files live in the
  # app tree and are referenced explicitly here so the widget compiles JUST those (never the
  # whole app / Core Data / domain layer). Inherits the project's unsigned-simulator base.
  AkashicWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AkashicWidgets
      # Shared (App-Group-free / domain-free) files compiled into both targets:
      - path: Akashic/App/AppGroup.swift
      - path: Akashic/Services/WidgetSnapshot.swift
      - path: Akashic/Services/WidgetDataStore.swift
      - path: Akashic/Services/JourneyStatsWidgetView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app.widgets
        PRODUCT_NAME: AkashicWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: AkashicWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # Extensions are packaged inside the host app, never installed on their own.
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        # The widget ships WITHOUT the shared App Group for now — deliberately.
        #
        # It reads live journey data only when `AppGroup.containerURL` resolves; with
        # no group it renders its bundled placeholder, which is exactly the state it
        # is in today (nothing writes the snapshot yet). Carrying an entitlement the
        # extension cannot use would only add a provisioning dependency for no gain,
        # and `xcodebuild -allowProvisioningUpdates` cannot mint the widget's profile
        # from an App Store Connect API key (it rejects the key that the ASC API
        # itself accepts), so it blocked archiving outright.
        #
        # To light the widget up (see AkashicWidgets/AkashicWidgets.entitlements,
        # kept as the reference): open the project in Xcode, select the
        # AkashicWidgets target -> Signing & Capabilities -> add App Groups ->
        # group.no.akashic, then restore CODE_SIGN_ENTITLEMENTS on both configs here.
        Debug-CloudKit:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8
        Release-CloudKit:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8
        Debug-Production:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9LVCB72DT8

schemes:
  Akashic:
    build:
      targets:
        Akashic: all
        AkashicTests: [test]
        AkashicUITests: [test]
    run:
      config: Debug
      # QUA-10: the local StoreKit configuration, so the paywall's PRICED state exists at all
      # without an App Store connection. Without it `Product.products(for:)` returns an empty array
      # on a simulator, `EntitlementStore.product` stays nil, and the paywall renders its "isn't
      # available here yet" row — a real state, but not the one a customer sees.
      #
      # This reaches the RUN action only, and that is a limitation rather than a choice: XcodeGen
      # 2.45.4 writes `StoreKitConfigurationFileReference` into the scheme's `<LaunchAction>` and
      # has no equivalent key for `<TestAction>` (verified by generating and reading the
      # `.xcscheme`; `shouldUseLaunchSchemeArgsEnv` carries arguments and environment, not this).
      # So `xcodebuild test` — and therefore the UI tests — run with no local store, and
      # `AkashicUITests/PaywallUITests` documents which paywall branch that leaves unreachable
      # instead of pretending to cover it. Adding it under `test:` here would be a silently
      # ignored key, which is the precise failure mode the INFOPLIST_KEY_* note above exists for.
      storeKitConfiguration: Akashic/Store/Akashic.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AkashicTests
        # QUA-29's finish line is the audit running unattended, so the UI tests are in the SHARED
        # scheme's test action rather than a separate one: `xcodebuild ... test` — the exact
        # command apple-ci.yml runs — picks them up.
        - AkashicUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
