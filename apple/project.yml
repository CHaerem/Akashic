name: Akashic
options:
  bundleIdPrefix: no.akashic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

# Build configurations.
#   Debug / Release  -> no code signing, no team required (default simulator builds).
#   Release-CloudKit -> opt-in config that turns on the CloudKit + Push entitlements.
#                       Enable a DEVELOPMENT_TEAM here (or via CLI override) once an
#                       Apple Developer team is configured on the build machine.
configs:
  Debug: debug
  Release: release
  Release-CloudKit: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Simulator builds must succeed without a signing team on this machine.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Akashic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Akashic
      # Fixture JSON recovered from git history — bundled so the app runs on
      # fixtures by default (before CloudKit is wired up). Owned by another agent;
      # referenced read-only here.
      - path: Fixtures/recovered/kilimanjaro.json
        buildPhase: resources
      - path: Fixtures/recovered/mountKenya.json
        buildPhase: resources
      - path: Fixtures/recovered/incaTrail.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app
        PRODUCT_NAME: Akashic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Akashic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        # Opt-in CloudKit build. Not used by the default `build`/`test` invocations,
        # so the machine needs no signing team for CI. To ship CloudKit sync:
        #   1. Set DEVELOPMENT_TEAM below (or pass DEVELOPMENT_TEAM=XXXX on the CLI).
        #   2. Build the `Release-CloudKit` configuration.
        #   3. Flip Config.persistenceMode default / FeatureFlags.cloudKitEnabled.
        Release-CloudKit:
          CODE_SIGN_ENTITLEMENTS: Akashic/Support/Akashic.entitlements
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"

  AkashicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AkashicTests
      # Bundle the fixtures into the test bundle too, so unit tests can decode
      # them without relying on the host app bundle layout.
      - path: Fixtures/recovered/kilimanjaro.json
        buildPhase: resources
      - path: Fixtures/recovered/mountKenya.json
        buildPhase: resources
      - path: Fixtures/recovered/incaTrail.json
        buildPhase: resources
    dependencies:
      - target: Akashic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.akashic.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Akashic:
    build:
      targets:
        Akashic: all
        AkashicTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AkashicTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
